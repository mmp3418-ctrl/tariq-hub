<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة — منصة طارق</title>
    <meta
      http-equiv="refresh"
      content="0;url=/"
    />
    <script>
      // Soft fallback for hosts that serve a real 404.html instead of SPA rewrite.
      try {
        var path = location.pathname + location.search + location.hash;
        if (path && path !== "/") {
          sessionStorage.setItem("tariq-spa-path", path);
        }
      } catch (e) {}
      location.replace("/");
    </script>
  </head>
  <body style="font-family: Cairo, sans-serif; padding: 2rem; text-align: center">
    <p>الصفحة غير موجودة</p>
    <p><a href="/">العودة للرئيسية</a></p>
  </body>
</html>
