<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="منصة طارق — منصة دراسة للمنهج الليبي. المراحل، الصفوف، الملخصات، والشروحات المرئية في مسار واحد."
    />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("tariq-theme");
          const locale = localStorage.getItem("tariq-locale");
          // Default is always light unless the user explicitly chose dark.
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.dataset.theme = "light";
            document.documentElement.style.colorScheme = "light";
          }
          if (locale === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>منصة طارق — Tariq Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
